name: Materialize v1.1.0 admitted open data

on:
  push:
    branches:
      - v1.1.0-source-extension-prep
    paths:
      - .github/workflows/materialize_v110_open_data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.0-source-extension-prep

      - name: Download only hash-matching official snapshots
        shell: python
        run: |
          from pathlib import Path
          import hashlib, time, urllib.request

          targets = [
              {
                  "name": "public_transportation_stations_2026-05-05_01-47-13_1.csv",
                  "url": "https://www.dubaipulse.gov.ae/dataset/fd25f886-5c7a-496e-b547-0bed0df5f5ef/resource/75ee9a69-9744-4356-91ea-66d4713a9f1d/download/public_transportation_stations.csv",
                  "sha256": "d0c8f689f12904b1944260ec456ecbecb3a827c6760cc4256973c64acf67ea6b",
              },
              {
                  "name": "population_by_community_2026-04-29_13-36-57_1.csv",
                  "url": "https://www.dubaipulse.gov.ae/dataset/d561ddcb-c04c-4827-aa03-b9d8abcb5fff/resource/bedb04be-66cf-4b66-a628-07e5c674a3af/download/population_by_community.csv",
                  "sha256": "d6d4cc288de5a66c6aba054b486f998f495aba0471c33b3071e458a0d2bdd8d1",
              },
          ]

          outdir = Path("source_extension_v1.1.0/data/raw_open")
          outdir.mkdir(parents=True, exist_ok=True)

          for target in targets:
              data = None
              last_error = None
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(
                          target["url"],
                          headers={"User-Agent": "WEVJ-reproducibility-source-lock/1.1"},
                      )
                      with urllib.request.urlopen(req, timeout=90) as response:
                          data = response.read()
                      break
                  except Exception as exc:
                      last_error = exc
                      time.sleep(5 * (attempt + 1))
              if data is None:
                  raise SystemExit(f"Could not download {target['name']}: {last_error}")

              digest = hashlib.sha256(data).hexdigest()
              if digest != target["sha256"]:
                  raise SystemExit(
                      f"HASH MISMATCH for {target['name']}: expected {target['sha256']} got {digest}. "
                      "The current portal resource is not the retained study snapshot; refusing to commit it."
                  )
              (outdir / target["name"]).write_bytes(data)
              print(f"PASS {target['name']} {digest}")

      - name: Commit admitted snapshots if exact matches were recovered
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_extension_v1.1.0/data/raw_open/
          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Add hash-verified Dubai open-data snapshots for v1.1.0 prep"
            git push origin HEAD:v1.1.0-source-extension-prep
          fi
